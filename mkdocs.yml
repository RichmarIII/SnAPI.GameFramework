site_name: SnAPI.GameFramework
site_description: World-owned C++23 gameplay framework with GameRuntime, levels, reflection, serialization, networking, physics, UI, audio, rendering, and scripting
site_url: https://richmarIII.github.io/SnAPI.GameFramework
repo_url: https://github.com/RichmarIII/SnAPI.GameFramework
repo_name: RichmarIII/SnAPI.GameFramework
edit_uri: ""

docs_dir: docs-src
site_dir: docs
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start Here: tutorials.md
  - Architecture: architecture.md
  - Tutorials:
      - Core Guides:
          - Worlds, Levels, and Hierarchies: tutorials/worlds_graphs.md
          - Nodes and Components: tutorials/nodes_components.md
          - Input System: tutorials/input.md
          - UI System: tutorials/ui.md
          - Renderer Integration: tutorials/renderer.md
          - Physics System and Components: tutorials/physics.md
          - Physics Queries and Events: tutorials/physics_queries_events.md
          - Reflection and Serialization: tutorials/reflection_serialization.md
          - AssetPipeline Integration: tutorials/assetpipeline.md
          - Networking, Replication, and Reflected RPC: tutorials/networking.md
          - Audio Components: tutorials/audio.md
          - Testing and Validation: tutorials/testing.md
      - Project Labs:
          - First Play Session: tutorials/first_play_session.md
          - Space Station Partitions: tutorials/space_station_partitions.md
          - Couch Co-op Laser Tag: tutorials/couch_coop_laser_tag.md
          - Haunted Radio: tutorials/haunted_radio.md
          - Bouncy Basement: tutorials/bouncy_basement.md
          - Shipyard Save/Load: tutorials/shipyard_save_load.md
          - Postcard Renderer: tutorials/postcard_renderer.md
          - Net Arena: tutorials/net_arena.md
          - Tool World vs Game World: tutorials/tool_world_vs_game_world.md
          - Scripted Gadget Lab: tutorials/scripted_gadget_lab.md
  - API Reference:
      - Overview: api/index.md
      - Namespaces: api/namespaces.md
      - Types: api/types.md
      - Files: api/files.md
